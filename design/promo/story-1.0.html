<!doctype html>
<!-- Instagram story 1080 × 1920 announcing KARTUN 1.0. Shot to PNG by design/promo/shoot-story.mjs.
     «До» = a 128 px piece of the 256 px sample (Real-ESRGAN input2, BSD-3) stretched pixel by pixel; «После» = the same piece upscaled 4×
     by KARTUN 1.0 (NomosWebPhoto) on the HEADWOLF Titan 1, 2026-10-16 - a real result, not an effect.
     ?lang=en switches the text to English. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Unbounded; src: url(unbounded.ttf); font-weight: 200 900; }
  @font-face { font-family: Manrope; src: url(manrope.ttf); font-weight: 200 800; }
  :root { --bg: #0D0D0D; --pink: #FF1A8C; --text: #F5F5F7; --muted: #9A9AA2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: var(--bg); overflow: hidden; }
  body {
    font-family: Manrope, sans-serif; color: var(--text);
    display: flex; flex-direction: column; align-items: center;
    /* a soft pink glow behind the photo - the only decoration */
    background: radial-gradient(900px 700px at 50% 52%, rgba(255, 26, 140, 0.16), transparent 70%), var(--bg);
  }
  .top { margin-top: 200px; display: flex; flex-direction: column; align-items: center; }
  .heart { width: 150px; height: 140px; filter: drop-shadow(0 0 30px rgba(255, 26, 140, 0.45)); }
  .title { margin-top: 34px; font-family: Unbounded; font-weight: 800; font-size: 112px; letter-spacing: 2px; line-height: 1; }
  .title .k { color: var(--pink); }
  .title .v { font-weight: 300; margin-left: 18px; }
  .kicker { margin-top: 22px; font-family: Unbounded; font-weight: 500; font-size: 28px; letter-spacing: 9px;
            color: var(--pink); text-transform: uppercase; }

  .compare { position: relative; margin-top: 64px; width: 860px; height: 860px; border-radius: 56px; overflow: hidden;
             box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 255, 255, 0.06); }
  .compare img { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
  /* the divider at 42 %: the cliff, the most detailed part, crosses it */
  .compare .after { clip-path: inset(0 0 0 42%); image-rendering: auto; }
  .line { position: absolute; top: 0; bottom: 0; left: 42%; width: 6px; margin-left: -3px; background: var(--pink); }
  .knob { position: absolute; left: 42%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%;
          background: var(--pink); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45); display: flex; align-items: center; justify-content: center; }
  .tag { position: absolute; top: 30px; padding: 12px 26px; border-radius: 40px; font-weight: 700; font-size: 30px;
         background: rgba(30, 30, 34, 0.72); color: var(--text); }
  .tag.l { left: 30px; } .tag.r { right: 30px; }

  .lead { margin-top: 64px; width: 860px; text-align: center; font-weight: 600; font-size: 46px; line-height: 1.3; }
  .chips { margin-top: 36px; display: flex; gap: 16px; }
  .chip { padding: 14px 28px; border-radius: 40px; border: 2px solid rgba(255, 255, 255, 0.14); font-weight: 600; font-size: 28px;
          color: var(--muted); }
  .url { margin-top: 44px; font-weight: 600; font-size: 28px; color: var(--muted); letter-spacing: 0.5px; }
  .url b { color: var(--text); font-weight: 700; }
</style>
</head>
<body>
  <div class="top">
    <img class="heart" src="heart.svg" alt="">
    <div class="title"><span class="k">K</span>ARTUN<span class="v">1.0</span></div>
    <div class="kicker" data-ru="Вышел релиз" data-en="Out now">Вышел релиз</div>
  </div>

  <div class="compare">
    <img src="beach_before.png" alt="">
    <img class="after" src="beach_after.png" alt="">
    <div class="line"></div>
    <div class="knob">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6 L3 12 L9 18"/><path d="M15 6 L21 12 L15 18"/>
      </svg>
    </div>
    <div class="tag l" data-ru="До" data-en="Before">До</div>
    <div class="tag r" data-ru="После" data-en="After">После</div>
  </div>

  <div class="lead" data-ru="Нейросеть делает фото большим и чётким — прямо на телефоне"
       data-en="A neural network makes your photo big and sharp — right on your phone">Нейросеть делает фото большим и чётким — прямо на телефоне</div>
  <div class="chips">
    <div class="chip" data-ru="Без сети" data-en="Offline">Без сети</div>
    <div class="chip" data-ru="Открытый код" data-en="Open source">Открытый код</div>
    <div class="chip">Android 14+</div>
  </div>

  <div class="url">github.com/MikalaiKryvusha/<b>KARTUN</b></div>

  <script>
    if (new URLSearchParams(location.search).get('lang') === 'en') {
      document.documentElement.lang = 'en';
      for (const el of document.querySelectorAll('[data-en]')) el.textContent = el.dataset.en;
    }
  </script>
</body>
</html>
