<!doctype html>

     нашем сердце» · «Свертка: быстрее, и пусть не линия порождает сверточный пиксель, а пусть он выпрыгиват из окна и
     становится в свертку» · «Внимание: бсытрее, веселее, переливы, можно линии не делать» · «Квадродерево: быстрее,
     веселее, переливы» · «Игра в жизнь: больше размерность сетки, быстрее, и сидить реальными сидами, чтобы там рально
     считались интересные узнаваемые паттерны, и переливы цветов, быстрее» · «Сортировка: веселее, быстрее, переливы» ·
     «Фурье: быстрее, веселее, переливы» · «Остальные не берём.» · «ДУмай, как их сейчас в макете приблизить к тому, что у

<html lang="ru">
<head>
<meta charset="utf-8">
<title>Состояния живой анимации KARTUN</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0D0D0D; --low: #151516; --text: #F2F2F3; --sub: #9A9AA0; --pink: #FF1A8C; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #070707; color: var(--text); font-family: 'Manrope', sans-serif; padding: 28px; }
  h1 { font: 700 24px 'Unbounded', sans-serif; margin-bottom: 6px; } h1 b { color: var(--pink); }
  .lead { color: var(--sub); margin-bottom: 22px; max-width: 980px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 18px; }
  .box { background: var(--low); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .box.wide { grid-column: span 2; grid-row: span 2; }
  .box h2 { font: 700 14px 'Unbounded', sans-serif; } .box h2 span { color: var(--pink); }
  .box p { color: var(--sub); font-size: 13px; line-height: 1.45; }
  .stage { background: var(--bg); border-radius: 18px; aspect-ratio: 1; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<h1>Состояния живой анимации <b>KARTUN</b></h1>
<p class="lead">Квадратики живут так же, как в сердце нашего спиннера: тот же перелив цвета, те же вспышки и биение, плюс лёгкое
  покачивание и дыхание размера. Первая карточка — как это будет в приложении: квадратики перелетают из фигуры в фигуру.</p>
<div class="grid" id="grid"></div>
<script src="spinner-engine.js"></script>
<script>
// --- cards
const CARDS = ['tour', 'net', 'conv', 'attn', 'quad', 'life', 'sort', 'fourier'];
const grid = document.getElementById('grid'), runs = [];
CARDS.forEach((key, n) => { const s = S[key], box = document.createElement('div'); box.className = 'box' + (s.wide ? ' wide' : '');
  box.innerHTML = `<h2>${s.title}${s.star ? ' <span>★</span>' : ''}${s.own ? ' <span>· Ваша</span>' : ''}</h2><div class="stage"><canvas></canvas></div><p>${s.text || ''}</p>`;
  grid.appendChild(box); runs.push({ s, cv: box.querySelector('canvas') }); });
function tick(now) {
  for (const { s, cv } of runs) {
    const r = cv.getBoundingClientRect(), W = Math.round(r.width * devicePixelRatio);
    if (cv.width !== W) { cv.width = W; cv.height = W; }
    const ctx = cv.getContext('2d'), g = { ctx, W }; ctx.clearRect(0, 0, W, W);
    if (s.extra && s !== S.tour) s.extra(g, now);
    if (s === S.tour) s.extra(g, now);
    for (const q of s.sq(now)) { ctx.fillStyle = rgb(q.c); ctx.fillRect((q.x - q.s / 2) * W, (q.y - q.s / 2) * W, q.s * W, q.s * W); }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
